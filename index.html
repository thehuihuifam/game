<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>소진</title>
<style>
  :root {
    --bg: #10131a;
    --panel: #181c26;
    --panel2: #1f2431;
    --ink: #e9ecf4;
    --ink-dim: #9aa3b8;
    --accent: #ffd166;
    --health: #e4573d;
    --mood: #f2b632;
    --time: #4f86f7;
    --ok: #6fc276;
    --bad: #e4573d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    position: fixed;
    inset: 0;
    width: 100%;
  }

  /* 자원 색 매핑 — RESOURCES에 자원을 늘리면 여기 한 줄씩 추가 */
  [data-res="health"] { --res: var(--health); }
  [data-res="mood"]   { --res: var(--mood); }
  [data-res="time"]   { --res: var(--time); }

  /* ── 상단 자원 헤더 (VIEW가 RESOURCES로 조립) ─────── */
  #topbar {
    display: flex;
    align-items: stretch;
    gap: 8px;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background: var(--panel);
    border-bottom: 1px solid #262c3b;
  }
  #topbar .day {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    min-width: 56px;
    border-radius: 12px;
    background: var(--panel2);
    padding: 6px 8px;
  }
  #topbar .day .num { font-size: 20px; font-weight: 800; line-height: 1; color: var(--accent); }
  #topbar .day .lbl { font-size: 10px; color: var(--ink-dim); margin-top: 3px; letter-spacing: .05em; }
  #topbar .stats { flex: 1; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  .stat { display: flex; align-items: center; gap: 7px; }
  .stat .ico { width: 14px; height: 14px; flex: 0 0 auto; color: var(--res); }
  .stat .ico svg { width: 100%; height: 100%; display: block; }
  .stat .barwrap { flex: 1; height: 10px; border-radius: 6px; background: #0c0f16; overflow: hidden; display: flex; }
  .stat .bar { width: 100%; height: 100%; border-radius: 6px; background: var(--res); transition: width .25s ease; }
  .stat .num { font-size: 11px; font-weight: 700; width: 34px; text-align: right; color: var(--ink-dim); }
  .stat .rlbl { font-size: 11px; font-weight: 700; color: var(--ink-dim); }
  .stat .pips { display: flex; gap: 4px; }
  .stat .pip { width: 9px; height: 9px; border-radius: 3px; background: #0c0f16; }
  .stat .pip.on { background: var(--res); }

  /* ── 화면(뷰) 공통 ──────────────────────────────── */
  #stage { flex: 1; position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 16px 14px 18px; }
  .hidden { display: none !important; }

  /* ── 카드(선택창) ───────────────────────────────── */
  #cardView { justify-content: space-between; }
  .card { background: var(--panel); border: 1px solid #2a3040; border-radius: 18px; padding: 16px 16px 14px; }
  .card .tag { font-size: 11px; color: var(--accent); letter-spacing: .12em; font-weight: 700; }
  .card .title { font-size: 21px; font-weight: 800; margin: 7px 0 9px; line-height: 1.25; }
  .card .text { font-size: 14px; color: var(--ink-dim); line-height: 1.5; }
  #options { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
  .opt {
    display: flex; flex-direction: column; gap: 8px;
    width: 100%;
    background: var(--panel2);
    border: 1px solid #2c3346;
    border-radius: 14px;
    padding: 13px 14px;
    text-align: left;
    color: var(--ink);
    font-size: 15px; font-weight: 700; line-height: 1.3;
    cursor: pointer;
  }
  .opt:active { background: #2a3147; }
  .opt .line2 { display: flex; align-items: center; gap: 10px; }
  .opt .label { flex: 1; }
  .opt .costs { display: flex; gap: 6px; flex: 0 0 auto; align-items: center; }

  /* ── 자원 칩 (선택지 미리보기 + 효과 화면 공용) ──── */
  .cost { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; padding: 3px 7px; border-radius: 7px; background: #0c0f16; }
  .cost svg { width: 11px; height: 11px; color: var(--res); }
  .cost.pos { color: var(--ok); }
  .cost.neg { color: var(--bad); }

  /* ── 효과 화면 ──────────────────────────────────── */
  #effectView { justify-content: space-between; align-items: stretch; }
  #effectPanel { background: var(--panel); border: 1px solid #2a3040; border-radius: 18px; padding: 18px 16px; margin-top: 8px; }
  #effectPanel .tag { font-size: 11px; color: var(--mood); letter-spacing: .12em; font-weight: 700; }
  #effectPanel .title { font-size: 20px; font-weight: 800; margin: 8px 0 10px; line-height: 1.3; }
  #effectPanel .delta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  #effectPanel .flavor { font-size: 14px; color: var(--ink-dim); line-height: 1.55; }
  #effectPanel .conseq { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; line-height: 1.4; }
  #effectPanel .conseq.good { background: #17321c; color: var(--ok); border: 1px solid #24492a; }
  #effectPanel .conseq.bad  { background: #3a1a16; color: var(--bad); border: 1px solid #5a2720; }
  #effectPanel .conseq.note { background: #16203a; color: #9db4f5; border: 1px solid #26365c; }
  #effectPanel .dayend { display: flex; flex-direction: column; gap: 8px; }
  #effectPanel .dayend .delta { margin: 0; }
  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: none;
    background: var(--accent);
    color: #161006;
    font-size: 17px; font-weight: 800;
    cursor: pointer;
    margin-top: 14px;
  }
  .btn:active { filter: brightness(.9); }

  /* ── 종료 화면 ──────────────────────────────────── */
  #endView { justify-content: center; align-items: center; text-align: center; gap: 18px; }
  #endView .big { font-size: 34px; font-weight: 800; }
  #endView .why { font-size: 15px; color: var(--ink-dim); line-height: 1.5; }
  #endView .btn { margin-top: 6px; }

  /* ── 가로 모드 차단 ─────────────────────────────── */
  #rotate { display: none; }
  @media (orientation: landscape) {
    #rotate {
      position: fixed; inset: 0; z-index: 99;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink); font-size: 15px; text-align: center; padding: 24px;
    }
    #game { display: none; }
  }
</style>
</head>
<body>
<div id="game">
  <div id="topbar">
    <div class="day"><div class="num" id="dayNum">1</div><div class="lbl">DAY</div></div>
    <div class="stats" id="stats"></div>
  </div>

  <div id="stage">
    <section class="view" id="cardView">
      <div class="card">
        <div class="tag" id="cardTag"></div>
        <div class="title" id="cardTitle"></div>
        <div class="text" id="cardText"></div>
      </div>
      <div id="options"></div>
    </section>

    <section class="view hidden" id="effectView">
      <div id="effectPanel">
        <div class="tag" id="fxTag"></div>
        <div class="title" id="fxTitle"></div>
        <div class="delta" id="fxDelta"></div>
        <div class="flavor" id="fxFlavor"></div>
        <div class="conseq note hidden" id="fxConseq"></div>
        <div class="conseq note dayend hidden" id="fxDayEnd"></div>
      </div>
      <button class="btn" id="fxNext" type="button"></button>
    </section>

    <section class="view hidden" id="endView">
      <div class="big" id="endTitle"></div>
      <div class="why" id="endWhy"></div>
      <button class="btn" id="endBtn" type="button">다시 살아보기</button>
    </section>
  </div>
</div>
<div id="rotate">세로로 돌려 주세요</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════
   DATA — 자원·카드·팩·하루 사이클·문구. 읽기 전용 상수.
   스키마는 AGENTS.md "시스템 스펙" 참조. 이 구역은 DOM·state를 모른다.
   ═══════════════════════════════════════════════════════════════ */

/* ① 자원 — 한 줄을 추가하면 게이지가 늘어난다 */
const RESOURCES = [
  { key: "health", ko: "체력", min: 0, max: 100, start: 48, ui: "bar",  shape: "square", deadly: true  },
  { key: "mood",   ko: "기분", min: 0, max: 100, start: 48, ui: "bar",  shape: "circle", deadly: true  },
  { key: "time",   ko: "시간", min: 0, max: 12,  start: 8,  ui: "pips", shape: "clock",  deadly: false },
];

/* ② 도형 — 외부 에셋 금지(불변식 4). 색은 currentColor(CSS의 --res) */
const SHAPES = {
  square: '<rect x="2" y="3" width="8" height="7" rx="2" fill="currentColor"/>',
  circle: '<circle cx="6" cy="6" r="5" fill="currentColor"/>',
  clock:  '<rect x="2" y="4" width="8" height="6" rx="1" fill="currentColor"/><rect x="5" y="3" width="2" height="2" fill="currentColor"/>',

/* ③ 카드 — 순수 창작 픽션(소재: MATERIALS.md). effects의 키는 RESOURCES.key */

    title: "알람이 울렸다.",
    text: "몸은 천 근이고, 오늘은 1교시부터 체육이다. 아이들은 아직 자고 있다.",
    options: [
      { label: "일어나 몸부터 푼다",         flavor: "냉수를 마시고 스트레칭. 몸이 깨어나는 게 느껴진다.",

    tag: "오후 수업",

    text: "울먹이는 아이를 데리고 양호실로 달려야 한다.",
    options: [
      { label: "안심시키고 담임을 부른다",    flavor: "아이 손을 잡고 기다려준다. 다음 수업은 약속을 조정.",

    options: [

/* ⑥ 문구 — RULE에 한국어 리터럴을 두지 않는다. {자리}는 RULE이 채운다 */

/* ⑦ 종료 문구 */
const ENDINGS = {

  nextLabel: "결과 보기",
  death: {
    health: { now: "체력이 바닥났다. 눈앞이 흐릿해진다.", nightfall: "지친 하루 끝에 몸이 무너졌다." },
    mood:   { now: "마음이 꺾였다. 하루가 버거워진다.",   nightfall: "지친 하루 끝에 마음이 꺾였다." },
  },
};

/* ═══════════════════════════════════════════════════════════════
   RULE — 순수 함수. state + 입력 -> 새 state. DOM을 모른다.
   전이표: T0 newGame / T1 choose / T2~T4 next
   ═══════════════════════════════════════════════════════════════ */

/* 문구 템플릿의 {자리}를 값으로 바꾼다 */
function fill(template, slots) {
  return Object.keys(slots).reduce((out, k) => out.split("{" + k + "}").join(slots[k]), template);
}

const RES  = Object.fromEntries(RESOURCES.map(r => [r.key, r]));
const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));

function clamp(key, v) {
  const r = RES[key];
  return Math.max(r.min, Math.min(r.max, v));
}

function applyEffects(resources, effects) {
  const next = { ...resources };
  for (const key of Object.keys(effects)) next[key] = clamp(key, next[key] + effects[key]);
  return next;
}

/* 선택 1회의 기본 시간 소모를 반영한 실제 효과 */
function withBaseCost(effects) {
  return { ...effects, time: (effects.time || 0) - DAY_CYCLE.baseTimeCost };
}

/* 표시용 델타: 0이 아닌 것만, 자원 정의 순서대로 */
function toDeltas(effects) {
  return RESOURCES.filter(r => effects[r.key]).map(r => ({ key: r.key, amount: effects[r.key] }));
}

/* 선택지에 미리 그려 줄 델타 (VIEW가 정책 없이 쓰기 위한 RULE의 출력) */
function previewDeltas(option) {
  return toDeltas(withBaseCost(option.effects));
}

function deadKey(resources) {
  const hit = RESOURCES.find(r => r.deadly && resources[r.key] <= r.min);
  return hit ? hit.key : null;
}

/* T0 — 새 판 */
function initialState() {
  return {
    phase: "card",
    day: 1,
    slot: 0,
    resources: Object.fromEntries(RESOURCES.map(r => [r.key, r.start])),
    cardId: null,
    usedToday: [],
    effect: null,
    pending: null,
    ending: null,
  };
}

/* 슬롯 -> 팩 -> 카드. 하루 안 중복은 usedToday로 막는다 */
function drawSlot(prev) {
  const pool = DAY_CYCLE.slots[prev.slot].packs.flatMap(id => PACKS[id].cards);
  const fresh = pool.filter(id => !prev.usedToday.includes(id));
  const pickFrom = (DAY_CYCLE.noRepeatInDay && fresh.length) ? fresh : pool;
  const cardId = pickFrom[Math.floor(Math.random() * pickFrom.length)];
  return { ...prev, phase: "card", cardId, usedToday: [...prev.usedToday, cardId], effect: null, pending: null };
}

function newGame() {
  return drawSlot(initialState());
}

function finish(s, win, why) {
  s.pending = "end";
  s.ending = { win, why };
  s.effect.nextLabel = ENDINGS.nextLabel;
  return s;
}

/* 하루 넘김: day+1·시간 refill은 지금(T1) 적용, 카드 드로는 next(T3)에서 */
function rollDay(s) {
  s.day += 1;
  s.resources = { ...s.resources, time: clamp("time", DAY_CYCLE.timeRefill) };
  if (s.day > DAY_CYCLE.goalDays) {
    s.effect.dayEnd.text += TEXTS.dayDone;
    return finish(s, true, fill(ENDINGS.win, { days: DAY_CYCLE.goalDays }));
  }
  s.pending = "day";
  s.effect.dayEnd.text += fill(TEXTS.dayStart, { day: s.day });
  s.effect.nextLabel = fill(TEXTS.nextDay, { day: s.day });
  return s;
}

/* T1 — 선택. 항상 effect로 간다(불변식 2: 선택 즉시 효과 표시) */
function choose(prev, index) {
  if (prev.phase !== "card") return prev;
  const card = CARD[prev.cardId];
  const option = card.options[index];
  const gained = withBaseCost(option.effects);

  const s = {
    ...prev,
    phase: "effect",
    resources: applyEffects(prev.resources, gained),
    effect: {
      tag: fill(TEXTS.choiceTag, { tag: card.tag }),
      title: option.label,
      deltas: toDeltas(gained),
      flavor: option.flavor,
      conseq: option.conseq || null,
      dayEnd: null,
      nextLabel: TEXTS.nextContinue,
    },
    pending: "slot",
  };

  // ① deadly 자원 소진 -> 죽음
  const dead = deadKey(s.resources);
  if (dead) return finish(s, false, ENDINGS.death[dead].now);

  // ② 시간을 다 태움 -> nightfall 적용 후 deadly 재검사
  if (s.resources.time <= RES.time.min) {
    s.resources = applyEffects(s.resources, DAY_CYCLE.nightfall.effects);
    s.effect.dayEnd = { text: DAY_CYCLE.nightfall.text, deltas: toDeltas(DAY_CYCLE.nightfall.effects) };
    const deadLate = deadKey(s.resources);
    if (deadLate) return finish(s, false, ENDINGS.death[deadLate].nightfall);
    return rollDay(s);
  }

  // ③ 마지막 슬롯 -> rest 적용 후 하루 넘김
  if (s.slot + 1 >= DAY_CYCLE.slots.length) {
    s.resources = applyEffects(s.resources, DAY_CYCLE.rest.effects);
    s.effect.dayEnd = { text: DAY_CYCLE.rest.text, deltas: toDeltas(DAY_CYCLE.rest.effects) };
    return rollDay(s);
  }

  // ④ 계속
  return s;
}

/* T2·T3·T4 — 효과 화면의 "다음" */
function next(prev) {
  if (prev.phase !== "effect" || !prev.pending) return prev;
  if (prev.pending === "end") return { ...prev, phase: "end" };
  const cleared = { ...prev, effect: null };
  return drawSlot(prev.pending === "day"
    ? { ...cleared, slot: 0, usedToday: [] }
    : { ...cleared, slot: prev.slot + 1 });
}

/* ═══════════════════════════════════════════════════════════════
   VIEW — render(state) 한 방향. state를 바꾸지 않는다.
   ═══════════════════════════════════════════════════════════════ */

const UI = { bar: {}, num: {}, pips: {} };

function el(id) { return document.getElementById(id); }

function shape(key) {
  return '<svg viewBox="0 0 12 12" aria-hidden="true">' + SHAPES[RES[key].shape] + "</svg>";
}

function chip(delta) {
  const r = RES[delta.key];
  const sign = delta.amount < 0 ? "" : "+";
  return '<span class="cost ' + (delta.amount < 0 ? "neg" : "pos") + '" data-res="' + r.key + '">' +
         shape(r.key) + "<span>" + r.ko + " " + sign + delta.amount + "</span></span>";
}

/* 상단 골격은 한 번만 조립 -> 이후 render는 값만 갱신(게이지 트랜지션 유지) */
function buildTopbar() {
  el("stats").innerHTML = RESOURCES.map(r => {
    const head = '<div class="stat" data-res="' + r.key + '"><span class="ico">' + shape(r.key) + "</span>";
    if (r.ui === "bar") return head + '<div class="barwrap"><div class="bar"></div></div><div class="num"></div></div>';
    const pips = Array.from({ length: r.max }, () => '<div class="pip"></div>').join("");
    return head + '<div class="rlbl">' + r.ko + '</div><div class="pips">' + pips + "</div></div>";
  }).join("");

  RESOURCES.forEach(r => {
    const row = document.querySelector('.stat[data-res="' + r.key + '"]');
    if (r.ui === "bar") {
      UI.bar[r.key] = row.querySelector(".bar");
      UI.num[r.key] = row.querySelector(".num");
    } else {
      UI.pips[r.key] = Array.from(row.querySelectorAll(".pip"));
    }
  });
}

function renderTopbar(s) {
  el("dayNum").textContent = s.day;
  RESOURCES.forEach(r => {
    const v = s.resources[r.key];
    if (r.ui === "bar") {
      UI.bar[r.key].style.width = ((v - r.min) / (r.max - r.min)) * 100 + "%";
      UI.num[r.key].textContent = v;
    } else {
      UI.pips[r.key].forEach((pip, i) => pip.classList.toggle("on", i < v));
    }
  });
}

function renderCard(s) {
  const card = CARD[s.cardId];
  el("cardTag").textContent = card.tag;
  el("cardTitle").textContent = card.title;
  el("cardText").textContent = card.text;

  const box = el("options");
  box.innerHTML = "";
  card.options.forEach((option, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt";
    btn.innerHTML = '<div class="line2"><span class="label">' + option.label + '</span><span class="costs">' +
                    previewDeltas(option).map(chip).join("") + "</span></div>";
    btn.addEventListener("click", () => onChoose(i));
    box.appendChild(btn);
  });
}

function renderEffect(fx) {
  el("fxTag").textContent = fx.tag;
  el("fxTitle").textContent = fx.title;
  el("fxDelta").innerHTML = fx.deltas.map(chip).join("");
  el("fxFlavor").textContent = fx.flavor;

  const conseq = el("fxConseq");
  conseq.className = fx.conseq ? "conseq " + fx.conseq.tone : "conseq hidden";
  conseq.textContent = fx.conseq ? fx.conseq.text : "";

  const dayEnd = el("fxDayEnd");
  dayEnd.className = fx.dayEnd ? "conseq note dayend" : "conseq note dayend hidden";
  dayEnd.innerHTML = fx.dayEnd
    ? "<span>" + fx.dayEnd.text + '</span><span class="delta">' + fx.dayEnd.deltas.map(chip).join("") + "</span>"
    : "";

  el("fxNext").textContent = fx.nextLabel;
}

function renderEnd(ending) {
  const title = el("endTitle");
  title.textContent = ending.win ? ENDINGS.winTitle : ENDINGS.loseTitle;
  title.style.color = ending.win ? "var(--mood)" : "var(--bad)";
  el("endWhy").textContent = ending.why;
  el("endBtn").textContent = ENDINGS.restart;
}

const VIEW_ID = { card: "cardView", effect: "effectView", end: "endView" };

function render(s) {
  renderTopbar(s);
  Object.keys(VIEW_ID).forEach(phase => el(VIEW_ID[phase]).classList.toggle("hidden", phase !== s.phase));
  if (s.phase === "card")   renderCard(s);
  if (s.phase === "effect") renderEffect(s.effect);
  if (s.phase === "end")    renderEnd(s.ending);
}

/* ═══════════════════════════════════════════════════════════════
   CONTROLLER — 이벤트 -> RULE -> render
   ═══════════════════════════════════════════════════════════════ */

let state = null;

function onChoose(index) {
  if (state.phase !== "card") return;
  state = choose(state, index);
  render(state);
}

function onNext() {
  if (state.phase !== "effect") return;
  state = next(state);
  render(state);
}

function onRestart() {
  if (state.phase !== "end") return;
  state = newGame();
  render(state);
}

buildTopbar();
el("fxNext").addEventListener("click", onNext);
el("endBtn").addEventListener("click", onRestart);
state = newGame();
render(state);

/* ── 스크롤·확대·당겨서 새로고침 차단 (불변식 5) ── */
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
["gesturestart", "gesturechange", "gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault())
);
document.addEventListener("dblclick", e => e.preventDefault());
</script>
</body>
</html>
