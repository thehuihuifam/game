<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>소진</title>
<style>
  :root {
    --bg: #10131a;
    --panel: #181c26;
    --panel2: #1f2431;
    --ink: #e9ecf4;
    --ink-dim: #9aa3b8;
    --accent: #ffd166;
    --health: #e4573d;
    --mood: #f2b632;
    --time: #4f86f7;
    --ok: #6fc276;
    --bad: #e4573d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    position: fixed;
    inset: 0;
    width: 100%;
  }

  /* ── 상단 자원 헤더 ─────────────────────────────── */
  #topbar {
    display: flex;
    align-items: stretch;
    gap: 8px;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background: var(--panel);
    border-bottom: 1px solid #262c3b;
  }
  #topbar .day {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    min-width: 56px;
    border-radius: 12px;
    background: var(--panel2);
    padding: 6px 8px;
  }
  #topbar .day .num { font-size: 20px; font-weight: 800; line-height: 1; color: var(--accent); }
  #topbar .day .lbl { font-size: 10px; color: var(--ink-dim); margin-top: 3px; letter-spacing: .05em; }
  #topbar .stats { flex: 1; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  .stat { display: flex; align-items: center; gap: 7px; }
  .stat .ico { width: 14px; height: 14px; flex: 0 0 auto; }
  .stat .barwrap { flex: 1; height: 10px; border-radius: 6px; background: #0c0f16; overflow: hidden; display: flex; }
  .stat .bar { width: 100%; height: 100%; border-radius: 6px; transition: width .25s ease; }
  .stat .num { font-size: 11px; font-weight: 700; width: 34px; text-align: right; color: var(--ink-dim); }
  #healthbar  { background: var(--health); }
  #moodbar   { background: var(--mood); }
  #timepips  { display: flex; gap: 4px; }
  #timepips .pip { width: 9px; height: 9px; border-radius: 3px; background: #0c0f16; }
  #timepips .pip.on { background: var(--time); }

  /* ── 화면(뷰) 공통 ──────────────────────────────── */
  #stage { flex: 1; position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 16px 14px 18px; }
  .hidden { display: none !important; }

  /* ── 카드(선택창) ───────────────────────────────── */
  #cardView { justify-content: space-between; }
  .card { background: var(--panel); border: 1px solid #2a3040; border-radius: 18px; padding: 16px 16px 14px; }
  .card .tag { font-size: 11px; color: var(--accent); letter-spacing: .12em; font-weight: 700; }
  .card .title { font-size: 21px; font-weight: 800; margin: 7px 0 9px; line-height: 1.25; }
  .card .text { font-size: 14px; color: var(--ink-dim); line-height: 1.5; }
  #options { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
  .opt {
    display: flex; flex-direction: column; gap: 8px;
    width: 100%;
    background: var(--panel2);
    border: 1px solid #2c3346;
    border-radius: 14px;
    padding: 13px 14px;
    text-align: left;
    color: var(--ink);
    font-size: 15px; font-weight: 700; line-height: 1.3;
    cursor: pointer;
  }
  .opt:active { background: #2a3147; }
  .opt .line2 { display: flex; align-items: center; gap: 10px; }
  .opt .label { flex: 1; }
  .opt .costs { display: flex; gap: 6px; flex: 0 0 auto; align-items: center; }
  .cost { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; padding: 3px 7px; border-radius: 7px; background: #0c0f16; }
  .cost svg { width: 11px; height: 11px; }
  .cost.pos { color: var(--ok); }
  .cost.neg { color: var(--bad); }

  /* ── 효과 화면 ──────────────────────────────────── */
  #effectView { justify-content: space-between; align-items: stretch; }
  #effectPanel { background: var(--panel); border: 1px solid #2a3040; border-radius: 18px; padding: 18px 16px; margin-top: 8px; }
  #effectPanel .tag { font-size: 11px; color: var(--mood); letter-spacing: .12em; font-weight: 700; }
  #effectPanel .title { font-size: 20px; font-weight: 800; margin: 8px 0 10px; line-height: 1.3; }
  #effectPanel .delta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  #effectPanel .delta .d { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 800; padding: 6px 10px; border-radius: 9px; background: #0c0f16; }
  #effectPanel .delta svg { width: 13px; height: 13px; }
  #effectPanel .flavor { font-size: 14px; color: var(--ink-dim); line-height: 1.55; }
  #effectPanel .conseq { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; line-height: 1.4; }
  #effectPanel .conseq.good { background: #17321c; color: var(--ok); border: 1px solid #24492a; }
  #effectPanel .conseq.bad  { background: #3a1a16; color: var(--bad); border: 1px solid #5a2720; }
  #effectPanel .conseq.note { background: #16203a; color: #9db4f5; border: 1px solid #26365c; }
  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: none;
    background: var(--accent);
    color: #161006;
    font-size: 17px; font-weight: 800;
    cursor: pointer;
    margin-top: 14px;
  }
  .btn:active { filter: brightness(.9); }

  /* ── 종료 화면 ──────────────────────────────────── */
  #endView { justify-content: center; align-items: center; text-align: center; gap: 18px; }
  #endView .big { font-size: 34px; font-weight: 800; }
  #endView .why { font-size: 15px; color: var(--ink-dim); line-height: 1.5; }
  #endView .btn { margin-top: 6px; }

  /* ── 가로 모드 차단 ─────────────────────────────── */
  #rotate { display: none; }
  @media (orientation: landscape) {
    #rotate {
      position: fixed; inset: 0; z-index: 99;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink); font-size: 15px; text-align: center; padding: 24px;
    }
    #game { display: none; }
  }
</style>
</head>
<body>
<div id="game">
  <div id="topbar">
    <div class="day"><div class="num" id="dayNum">1</div><div class="lbl">DAY</div></div>
    <div class="stats">
      <div class="stat">
        <svg class="ico" viewBox="0 0 12 12"><rect x="2" y="3" width="8" height="7" rx="2" fill="#e4573d"/></svg>
        <div class="barwrap"><div class="bar" id="healthbar"></div></div>
        <div class="num" id="healthNum">100</div>
      </div>
      <div class="stat">
        <svg class="ico" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#f2b632"/></svg>
        <div class="barwrap"><div class="bar" id="moodbar"></div></div>
        <div class="num" id="moodNum">100</div>
      </div>
      <div class="stat">
        <svg class="ico" viewBox="0 0 12 12"><rect x="2" y="4" width="8" height="6" rx="1" fill="#4f86f7"/><rect x="5" y="3" width="2" height="2" fill="#4f86f7"/></svg>
        <div class="num">시간</div>
        <div id="timepips"></div>
      </div>
    </div>
  </div>

  <div id="stage">
    <section class="view" id="cardView">
      <div class="card">
        <div class="tag" id="cardTag"></div>
        <div class="title" id="cardTitle"></div>
        <div class="text" id="cardText"></div>
      </div>
      <div id="options"></div>
    </section>

    <section class="view hidden" id="effectView">
      <div id="effectPanel">
        <div class="tag" id="fxTag"></div>
        <div class="title" id="fxTitle"></div>
        <div class="delta" id="fxDelta"></div>
        <div class="flavor" id="fxFlavor"></div>
        <div class="conseq note" id="fxConseq"></div>
      </div>
      <button class="btn" id="fxNext"></button>
    </section>

    <section class="view hidden" id="endView">
      <div class="big" id="endTitle"></div>
      <div class="why" id="endWhy"></div>
      <button class="btn" id="endBtn">다시 살아보기</button>
    </section>
  </div>
</div>
<div id="rotate">세로로 돌려 주세요</div>

<script>
"use strict";

/* ── 도형 아이콘 헬퍼 (외부 에셋 금지 — 인라인 SVG) ── */
const ICO = {
  health: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#e4573d"/></svg>',
  mood:   '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#f2b632"/></svg>',
  time:   '<svg viewBox="0 0 12 12"><rect x="2" y="4" width="8" height="6" rx="1" fill="#4f86f7"/><rect x="5" y="3" width="2" height="2" fill="#4f86f7"/></svg>',
};

/* ── 게임 상태 (단일 원천) ── */
const START = { health: 48, mood: 48, time: 8, day: 1, turn: 0 };
const DAY_TURNS = 5;   // 하루 = 선택 5번
const GOAL_DAYS = 3;   // 3일 완주 = 승리
const LABEL = [
  { key: "health", ko: "체력" },
  { key: "mood",   ko: "기분" },
  { key: "time",   ko: "시간" },
];
const TIME_PER_HAND = 1; // 선택 1번마다 시간 1 소모

let state = null;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/* ── 카드 팩 (순수 창작 픽션). 각 선택 = 체력/기분/시간의 트레이드오프 ── */
const CARDS = [

    options: [
      { label: "일어나 몸부터 푼다",          flavor: "냉수를 마시고 스트레칭. 몸이 깨어나는 게 느껴진다.", health:-5, mood:+5, time:-1, good:"몸은 힘들지만 기분은 맑아졌다." },
      { label: "10분만 더 잔다",              flavor: "눈을 감자마자 알람이 다시 울린다. 허겁지겁 뛰어나간다.", health:+3, mood:-2, time:-1, bad:"잠은 보충했지만 마음이 조급하다." },
      { label: "아이들 등교 준비부터 챙긴다",  flavor: "도시락을 싸고 가방을 챙겨준다. 마음은 놓인다.", health:-4, mood:+4, time:-2, good:"아이들 얼굴을 보고 나가니 한결 낫다." },
    ],
  },
  {

    tag: "오전 8시",
    title: "복도에서 학부모가 말을 걸어온다.",
    text: "수업 준비 시간인데, 통화하듯 긴 이야기가 시작됐다.",
    options: [
      { label: "끝까지 들어 드린다",          flavor: "이야기는 길어졌고, 준비 시간은 사라졌다.", health:0, mood:-4, time:-2, bad:"공감은 했지만 수업 준비가 밀렸다. 기분이 무겁다." },
      { label: "정중히 끊고 수업 준비",        flavor: "다음에 상담을 잡아 드린다. 숨 고르고 교실로.", health:-1, mood:0, time:0, good:"수업 준비가 덜 밀렸다. 조금은 미안하지만." },
      { label: "아이 얘기라 무시 못 한다",     flavor: "마음을 쏟아 들었다. 교무실 복귀는 늦어졌다.", health:-5, mood:+3, time:-2, good:"학부모가 안심하는 모습에 보람이 든다." },
    ],
  },
  {
    id: "lunch",
    tag: "정오",
    title: "점심인데 회의가 겹쳤다.",
    text: "급식실 갈 시간도 빠듯한데, 외부 강사 회의가 먼저 잡혀 있다.",
    options: [
      { label: "급하게 후루룩 먹는다",        flavor: "5분 만에 비운 밥. 허겁지겁 회의실로.", health:+2, mood:-5, time:0, bad:"어쨌든 밥은 먹었지만 마음만 급했다." },
      { label: "거르고 회의에 집중",          flavor: "회의는 잘 끝났지만 속이 비었다.", health:-7, mood:-1, time:+1, bad:"허기가 밀려온다. 오후가 위험하다." },
      { label: "잠깐 운동장을 돈다",          flavor: "밥 대신 잠깐 걸으며 기운을 돌린다.", health:-2, mood:+4, time:-1, good:"바깥바람이 머리를 식혔다." },
    ],
  },

    id: "injury",
    tag: "오후 수업",
    title: "아이가 넘어져 무릎이 까졌다.",
    text: "울먹이는 아이를 데리고 양호실로 달려야 한다.",
    options: [
      { label: "안심시키고 담임을 부른다",    flavor: "아이 손을 잡고 기다려준다. 다음 수업은 약속을 조정.", health:-2, mood:+3, time:-1, good:"아이가 웃음을 되찾았다." },
      { label: "빨리 처리하고 수업 복귀",     flavor: "효율적으로 처리. 수업은 제시간에 시작한다.", health:0, mood:-4, time:+1, bad:"아이를 두고 온 게 마음에 걸린다." },
      { label: "사고 기록까지 꼼꼼히 남긴다", flavor: "보고서를 쓰느라 시간이 길어졌다.", health:-4, mood:0, time:-2, good:"기록을 남겨 두니 마음은 든든하다." },
    ],
  },
  {

    tag: "방과 후",
    title: "전체 교직원 회의가 잡혔다.",

    options: [
      { label: "끝까지 남는다",               flavor: "회의는 길어졌다. 밤하늘 아래 퇴근.", health:-6, mood:-4, time:-2, bad:"몸도 마음도 축났다." },
      { label: "조퇴하고 아이들 픽업",        flavor: "가정사를 이유로 먼저 나온다. 마음은 급하다.", health:0, mood:+3, time:+1, note:"눈치는 보였지만 집에선 안도했다." },
      { label: "녹음 정리 요청을 자처",       flavor: "끝까지 있되, 몰입해서 듣는다.", health:-2, mood:-3, time:-2, note:"길었지만 몰입하니 오히려 덜 지쳤다." },
    ],
  },
  {
    id: "fever",
    tag: "저녁",
    title: "둘째가 열이 난다.",
    text: "해열제를 먹였지만 열이 안 떨어진다. 병원은 벌써 닫혔다.",
    options: [
      { label: "새벽까지 옆에서 간호",        flavor: "미지근한 물수건을 갈아 주며 밤을 샌다.", health:-7, mood:+3, time:-2, good:"해가 뜰 무렵 열이 내렸다. 안도감이 크다." },
      { label: "배우자와 교대한다",           flavor: "번갈아 짧게라도 잔다.", health:-2, mood:-1, time:-1, good:"조금씩 자 둔 덕에 그나마 버틸 만하다." },
      { label: "응급실에 간다",               flavor: "밤새 진료를 기다린다. 결과적으로 밤을 꼬박 샜다.", health:-6, mood:-5, time:-3, bad:"아이는 안정됐지만 몸이 남아나질 않는다." },
    ],
  },
  {
    id: "night",
    tag: "밤",
    title: "아이들이 잠들었다.",
    text: "이제야 혼자만의 시간. 내일 수업 자료도 밀려 있다.",
    options: [
      { label: "정리하고 곧장 잔다",          flavor: "자료는 미룬 채 이불 속으로. 눈이 감긴다.", health:+4, mood:+2, time:+1, good:"잠은 최고의 회복제다." },
      { label: "밤새 수업 자료를 만든다",     flavor: "눈을 비비며 자료를 완성한다.", health:-7, mood:-4, time:-2, bad:"자료는 끝냈지만 몸이 비명을 지른다." },
      { label: "잠깐 혼자 숨을 고른다",       flavor: "창밖을 멍하니 바라본다. 10분도 안 돼 잠들었다.", health:+2, mood:+3, time:0, good:"혼자만의 멍때림. 회복이 크다." },
    ],
  },
];

/* ── 렌더 ── */
function renderTopbar() {
  document.getElementById("dayNum").textContent = state.day;
  document.getElementById("healthbar").style.width = state.health + "%";
  document.getElementById("moodbar").style.width = state.mood + "%";
  document.getElementById("healthNum").textContent = state.health;
  document.getElementById("moodNum").textContent = state.mood;
  const pips = document.getElementById("timepips");
  pips.innerHTML = "";
  for (let i = 0; i < 12; i++) {
    const p = document.createElement("div");
    p.className = "pip" + (i < state.time ? " on" : "");
    pips.appendChild(p);
  }
}

function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function costBadge(key, amount) {
  const sign = amount < 0 ? "" : "+";
  const cls = amount < 0 ? "neg" : "pos";
  const ico = ICO[key];
  const ko = LABEL.find(l => l.key === key).ko;
  return `<span class="cost ${cls}">${ico}<span>${ko} ${sign}${amount}</span></span>`;
}

// 선택 1번의 기본 시간 소모를 반영한 순효과
function netTime(o) { return (o.time || 0) - TIME_PER_HAND; }

function drawCard(card) {
  document.getElementById("cardTag").textContent = card.tag;
  document.getElementById("cardTitle").textContent = card.title;
  document.getElementById("cardText").textContent = card.text;
  const opts = document.getElementById("options");
  opts.innerHTML = "";
  card.options.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    const costs = [
      ...["health","mood"].filter(k => o[k]).map(k => costBadge(k, o[k])),
    ];
    if (netTime(o) !== 0) costs.push(costBadge("time", netTime(o)));
    b.innerHTML = `<div class="line2"><span class="label">${o.label}</span><span class="costs">${costs.join("")}</span></div>`;
    b.addEventListener("click", () => choose(card, i));
    opts.appendChild(b);
  });
  show("cardView");
  renderTopbar();
}

/* ── 선택 처리 (즉시 효과 표시) ── */
function choose(card, index) {
  const o = card.options[index];

  // 자원 적용
  state.health = clamp(state.health + (o.health || 0), 0, 100);
  state.mood   = clamp(state.mood + (o.mood || 0), 0, 100);
  state.time   = clamp(state.time + netTime(o), 0, 12);
  state.turn  += 1;

  // 효과 표시
  document.getElementById("fxTag").textContent = card.tag + " · 선택";
  document.getElementById("fxTitle").textContent = o.label;
  const delta = [
    ...["health","mood"].filter(k => o[k]).map(k => costBadge(k, o[k])),
  ];
  if (netTime(o) !== 0) delta.push(costBadge("time", netTime(o)));
  document.getElementById("fxDelta").innerHTML = delta.join("");
  document.getElementById("fxFlavor").textContent = o.flavor;

  // 판정
  if (state.health <= 0) return endGame(false, "체력이 바닥났다. 눈앞이 흐릿해진다.");
  if (state.mood <= 0)   return endGame(false, "마음이 꺾였다. 하루가 버거워진다.");

  if (state.time <= 0) {
    // 시간을 다 태운 하루 — 벌칙 후 강제 종료
    state.health = clamp(state.health - 5, 0, 100);
    state.mood   = clamp(state.mood - 4, 0, 100);
    if (state.health <= 0) return endGame(false, "지친 하루 끝에 몸이 무너졌다.");
    if (state.mood <= 0)   return endGame(false, "지친 하루 끝에 마음이 꺾였다.");
    advanceDay("시간을 다 써버렸다. 남은 일이 내일로 밀린다.");
  } else if (state.turn >= DAY_TURNS) {
    advanceDay("하루를 마쳤다. 잠시 회복.");
  } else {
    const kk = o.good ? "good" : o.bad ? "bad" : "note";
    document.getElementById("fxConseq").textContent = o.good || o.bad || o.note || "";
    document.getElementById("fxConseq").className = "conseq " + kk;
    document.getElementById("fxNext").textContent = "계속";
  }
  renderTopbar();
  if (state.day > GOAL_DAYS) return; // 승리/종료 화면이 이미 표시됨
  show("effectView");
}

function advanceDay(reason) {
  state.day += 1;
  state.turn = 0;
  state.health = clamp(state.health + 4, 0, 100);
  state.mood   = clamp(state.mood + 3, 0, 100);
  state.time   = 12;
  if (state.day > GOAL_DAYS) {
    endGame(true);
    return;
  }
  const fx = document.getElementById("fxConseq");
  fx.textContent = reason + " — " + state.day + "일차 시작";
  fx.className = "conseq note";
  document.getElementById("fxNext").textContent = state.day + "일차로";
}

function endGame(win, why) {
  document.getElementById("endTitle").textContent = win ? "생존" : "번아웃";
  document.getElementById("endTitle").style.color = win ? "var(--mood)" : "var(--bad)";
  document.getElementById("endWhy").textContent =
    (win ? GOAL_DAYS + "일을 완주했다. " : "") + why;
  document.getElementById("endBtn").textContent = "다시 살아보기";
  show("endView");
}

/* ── 다음 카드 ── */
function nextCard() {
  // 팩을 순환시키되 같은 카드는 연속 금지
  let idx = Math.floor(Math.random() * CARDS.length);
  if (CARDS.length > 1 && state._last === idx) idx = (idx + 1) % CARDS.length;
  state._last = idx;
  drawCard(CARDS[idx]);
}

/* ── 시작/재시작 ── */
function newGame() {
  state = { ...START };
  state._last = -1;
  nextCard();
}

document.getElementById("fxNext").addEventListener("click", () => {
  if (state.health <= 0 || state.mood <= 0) return;
  nextCard();
});
document.getElementById("endBtn").addEventListener("click", newGame);

/* ── 스크롤·확대·당겨서 새로고침 차단 ── */
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
["gesturestart","gesturechange","gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault())
);
document.addEventListener("dblclick", e => e.preventDefault());

newGame();
</script>
